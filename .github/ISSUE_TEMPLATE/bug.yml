name: Bug report
description: Something is wrong with skillint
labels: [bug]
body:
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The exact command you ran
      placeholder: node dist/cli.js doctor -g
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "20.11.0"
    validations:
      required: true
