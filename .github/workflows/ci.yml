name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node dist/cli.js doctor ./skills --fail-on error
      - run: node dist/cli.js map . --agent codex --json

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - name: Smoke test packed CLI
        shell: bash
        run: |
          npm run build
          tarball="$(npm pack --silent)"
          sandbox="$(mktemp -d)"
          npm install --prefix "$sandbox" "./$tarball"
          "$sandbox/node_modules/.bin/skillint" --version
          cd "$sandbox"
          node_modules/.bin/skillint init smoke-test
          node_modules/.bin/skillint doctor ./skills --fail-on warning --fail-under 100
          node_modules/.bin/skillint map . --agent codex --json
