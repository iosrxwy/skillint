<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">skillint - static analysis for agent skills</title>
  <desc id="desc">A dark developer-tool social card with the skillint filter mark and a precise terminal audit.</desc>
