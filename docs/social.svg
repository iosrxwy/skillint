    <text x="50" y="456" fill="#D7DEDB" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">152 oversized files</text>
    <text x="492" y="456" text-anchor="end" fill="#66E3C4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">no files changed</text>
