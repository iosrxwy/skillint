      <rect x="72" width="13" height="13" rx="2"/><rect x="90" width="13" height="13" rx="2"/><rect x="108" width="13" height="13" rx="2"/><rect x="126" width="13" height="13" rx="2"/>
      <rect x="144" width="13" height="13" rx="2"/><rect x="162" width="13" height="13" rx="2"/><rect x="180" width="13" height="13" rx="2"/><rect x="198" width="13" height="13" rx="2"/>
