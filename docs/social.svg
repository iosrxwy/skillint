  <text x="72" y="174" fill="#66E3C4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="2">STATIC ANALYSIS FOR AGENT CONTEXT</text>
  <text x="72" y="260" fill="#F2F6F4" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="64" font-weight="760" letter-spacing="-2.6">eslint for</text>
  <text x="72" y="334" fill="#66E3C4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="62" font-weight="700" letter-spacing="-2.2">SKILL.md</text>
  <text x="72" y="397" fill="#A4AFAB" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21">Find duplicates, broken metadata, and context bloat</text>
  <text x="72" y="428" fill="#A4AFAB" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21">before agents rely on them.</text>

