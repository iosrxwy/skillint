    <text x="28" y="274" fill="#A4AFAB" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">metadata</text>
    <text x="492" y="274" text-anchor="end" fill="#EEF3F1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">~68,792 tokens</text>
    <text x="28" y="307" fill="#A4AFAB" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">all bodies</text>
