<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">skillint scan output</title>
  <desc id="desc">A dark terminal showing a read-only scan of 1,553 agent skills and their estimated context size.</desc>
  <rect width="960" height="540" fill="#090C0F"/>
  <rect x="16" y="16" width="928" height="508" rx="16" fill="#0D1216" stroke="#2A353C" stroke-width="2"/>
  <path d="M16 70h928" stroke="#222C32"/>

  <g transform="translate(38 34)">
    <rect width="20" height="20" rx="5" fill="#0B0E11" stroke="#273139"/>
    <g fill="none" stroke="#66E3C4" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4.5 6h4.5M4.5 10h7.5M4.5 14h4.5M9 6l3 4-3 4M12 10h4"/>
    </g>
  </g>
  <text x="70" y="49" fill="#D7DEDB" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700">skillint / scan</text>
  <text x="918" y="49" text-anchor="end" fill="#687570" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">~/agent-skills</text>

  <text x="40" y="108" fill="#66E3C4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700">$</text>
  <text x="64" y="108" fill="#F2F6F4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">skillint scan -g</text>
  <text x="40" y="150" fill="#D7DEDB" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">6 roots / 1,553 skills / 10 rules</text>

  <text x="40" y="190" fill="#83908B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">health</text>
  <text x="105" y="190" fill="#F4B860" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">0/100</text>
  <g transform="translate(166 178)" fill="#273139">
    <rect width="12" height="12" rx="2"/><rect x="17" width="12" height="12" rx="2"/><rect x="34" width="12" height="12" rx="2"/><rect x="51" width="12" height="12" rx="2"/>
    <rect x="68" width="12" height="12" rx="2"/><rect x="85" width="12" height="12" rx="2"/><rect x="102" width="12" height="12" rx="2"/><rect x="119" width="12" height="12" rx="2"/>
    <rect x="136" width="12" height="12" rx="2"/><rect x="153" width="12" height="12" rx="2"/><rect x="170" width="12" height="12" rx="2"/><rect x="187" width="12" height="12" rx="2"/>
  </g>
  <text x="386" y="190" fill="#F4B860" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">critical</text>

  <g>
    <rect x="38" y="222" width="430" height="246" rx="12" fill="#10161A" stroke="#222C32"/>
