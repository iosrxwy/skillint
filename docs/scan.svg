  <circle cx="44" cy="498" r="4" fill="#66E3C4"/>
  <text x="58" y="503" fill="#BDEBDD" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">indexed in 184 ms / no files changed</text>
  <text x="918" y="503" text-anchor="end" fill="#687570" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">skillint 0.8.0</text>
