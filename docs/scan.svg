    <text x="62" y="355" fill="#A4AFAB" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">all bodies</text>
    <text x="444" y="355" text-anchor="end" fill="#F4B860" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">~3,344,017 tokens</text>
    <text x="62" y="398" fill="#A4AFAB" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">always-on rules</text>
    <text x="444" y="398" text-anchor="end" fill="#687570" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">~0 tokens</text>
    <path d="M62 425h382" stroke="#222C32"/>
