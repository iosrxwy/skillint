    <text x="516" y="256" fill="#687570" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.5">BY SOURCE</text>
    <path d="M516 276h382" stroke="#222C32"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
      <circle cx="522" cy="307" r="4" fill="#66E3C4"/>
      <text x="538" y="312" fill="#D7DEDB">cursor-global</text>
      <text x="898" y="312" text-anchor="end" fill="#A4AFAB">1,102 files</text>

      <circle cx="522" cy="349" r="4" fill="#66E3C4"/>
      <text x="538" y="354" fill="#D7DEDB">agents-global</text>
      <text x="898" y="354" text-anchor="end" fill="#A4AFAB">318 files</text>

      <circle cx="522" cy="391" r="4" fill="#66E3C4"/>
      <text x="538" y="396" fill="#D7DEDB">grok-global</text>
      <text x="898" y="396" text-anchor="end" fill="#A4AFAB">55 files</text>

      <circle cx="522" cy="433" r="4" fill="#66E3C4"/>
      <text x="538" y="438" fill="#D7DEDB">other roots</text>
      <text x="898" y="438" text-anchor="end" fill="#A4AFAB">78 files</text>
