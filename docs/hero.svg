<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">skillint read-only analysis pipeline</title>
  <desc id="desc">A precise three-stage diagram showing an agent skill catalog being discovered, analyzed, and turned into an actionable audit.</desc>
  <rect width="1280" height="720" fill="#090C0F"/>
  <g stroke="#151B20" stroke-width="1">
    <path d="M0 72h1280M0 144h1280M0 216h1280M0 288h1280M0 360h1280M0 432h1280M0 504h1280M0 576h1280M0 648h1280"/>
    <path d="M64 0v720M208 0v720M352 0v720M496 0v720M640 0v720M784 0v720M928 0v720M1072 0v720M1216 0v720"/>
  </g>

  <g transform="translate(56 42)">
    <rect width="40" height="40" rx="9" fill="#0B0E11" stroke="#273139"/>
    <g fill="none" stroke="#66E3C4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 12h8.5"/>
      <path d="M9 20h14.5"/>
      <path d="M9 28h8.5"/>
      <path d="M17.5 12l6 8-6 8"/>
      <path d="M23.5 20H31"/>
    </g>
  </g>
  <text x="112" y="69" fill="#F2F6F4" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="720" letter-spacing="-.5">skillint</text>
  <text x="1218" y="68" text-anchor="end" fill="#66E3C4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="1.7">READ-ONLY ANALYSIS PIPELINE</text>
  <path d="M56 104h1168" stroke="#273139"/>

  <g>
    <rect x="56" y="138" width="328" height="514" rx="16" fill="#0D1216" stroke="#2A353C" stroke-width="2"/>
    <text x="84" y="178" fill="#66E3C4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.8">01 / DISCOVER</text>
    <text x="84" y="218" fill="#F2F6F4" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27" font-weight="700" letter-spacing="-.6">Agent catalog</text>
    <text x="84" y="245" fill="#83908B" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15">Index every supported skill root.</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
      <rect x="76" y="274" width="288" height="52" rx="8" fill="#11181D" stroke="#222C32"/>
      <path d="M96 291h12l4 5h14v14H96z" fill="none" stroke="#66E3C4" stroke-width="1.5" stroke-linejoin="round"/>
      <text x="140" y="306" fill="#D7DEDB">.cursor/skills</text>
      <text x="340" y="306" text-anchor="end" fill="#A4AFAB">1,102</text>

      <rect x="76" y="334" width="288" height="52" rx="8" fill="#11181D" stroke="#222C32"/>
      <path d="M96 351h12l4 5h14v14H96z" fill="none" stroke="#66E3C4" stroke-width="1.5" stroke-linejoin="round"/>
      <text x="140" y="366" fill="#D7DEDB">.agents/skills</text>
      <text x="340" y="366" text-anchor="end" fill="#A4AFAB">318</text>

      <rect x="76" y="394" width="288" height="52" rx="8" fill="#11181D" stroke="#222C32"/>
      <path d="M96 411h12l4 5h14v14H96z" fill="none" stroke="#66E3C4" stroke-width="1.5" stroke-linejoin="round"/>
      <text x="140" y="426" fill="#D7DEDB">.grok/skills</text>
      <text x="340" y="426" text-anchor="end" fill="#A4AFAB">55</text>

      <rect x="76" y="454" width="288" height="52" rx="8" fill="#11181D" stroke="#222C32"/>
      <path d="M96 471h12l4 5h14v14H96z" fill="none" stroke="#66E3C4" stroke-width="1.5" stroke-linejoin="round"/>
      <text x="140" y="486" fill="#D7DEDB">other roots</text>
      <text x="340" y="486" text-anchor="end" fill="#A4AFAB">78</text>
    </g>

    <path d="M76 536h288" stroke="#222C32"/>
    <text x="84" y="573" fill="#687570" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.4">INVENTORY</text>
    <text x="84" y="614" fill="#F2F6F4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="23" font-weight="700">1,553</text>
    <text x="162" y="614" fill="#83908B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">files indexed</text>
  </g>

  <g>
    <rect x="432" y="138" width="416" height="514" rx="16" fill="#0D1216" stroke="#2A353C" stroke-width="2"/>
    <text x="460" y="178" fill="#66E3C4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.8">02 / ANALYZE</text>
    <text x="460" y="218" fill="#F2F6F4" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27" font-weight="700" letter-spacing="-.6">Lint every file</text>
    <text x="460" y="245" fill="#83908B" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15">Parse metadata, compare bodies, estimate size.</text>

    <g fill="none" stroke="#66E3C4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M474 292h54"/>
      <path d="M474 332h90"/>
      <path d="M474 372h54"/>
      <path d="M528 292l36 40-36 40"/>
      <path d="M564 332h82"/>
    </g>
    <rect x="674" y="282" width="142" height="100" rx="12" fill="#11181D" stroke="#2A353C"/>
    <text x="745" y="316" text-anchor="middle" fill="#687570" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1.3">RULE SET</text>
    <text x="745" y="354" text-anchor="middle" fill="#F2F6F4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="27" font-weight="700">10</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
      <path d="M460 414h360" stroke="#222C32"/>
      <circle cx="471" cy="446" r="5" fill="#66E3C4"/>
      <text x="490" y="451" fill="#D7DEDB">frontmatter</text>
      <text x="820" y="451" text-anchor="end" fill="#66E3C4">parsed</text>

      <circle cx="471" cy="486" r="5" fill="#F4B860"/>
      <text x="490" y="491" fill="#D7DEDB">duplicate names</text>
      <text x="820" y="491" text-anchor="end" fill="#F4B860">60</text>

      <circle cx="471" cy="526" r="5" fill="#F4B860"/>
      <text x="490" y="531" fill="#D7DEDB">missing descriptions</text>
      <text x="820" y="531" text-anchor="end" fill="#F4B860">20</text>

      <circle cx="471" cy="566" r="5" fill="#F4B860"/>
      <text x="490" y="571" fill="#D7DEDB">oversized bodies</text>
      <text x="820" y="571" text-anchor="end" fill="#F4B860">152</text>
    </g>
    <rect x="460" y="600" width="360" height="30" rx="15" fill="#10201C" stroke="#285A4E"/>
    <circle cx="478" cy="615" r="4" fill="#66E3C4"/>
    <text x="492" y="620" fill="#BDEBDD" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">READ-ONLY / NO FILES MUTATED</text>
  </g>

  <g>
    <rect x="896" y="138" width="328" height="514" rx="16" fill="#0D1216" stroke="#2A353C" stroke-width="2"/>
    <text x="924" y="178" fill="#66E3C4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.8">03 / REPORT</text>
    <text x="924" y="218" fill="#F2F6F4" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27" font-weight="700" letter-spacing="-.6">Actionable audit</text>
    <text x="924" y="245" fill="#83908B" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15">Fix the highest-cost issues first.</text>

    <rect x="916" y="274" width="288" height="112" rx="12" fill="#11181D" stroke="#2A353C"/>
    <text x="940" y="306" fill="#687570" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1.3">EST. CONTEXT SIZE</text>
    <text x="940" y="354" fill="#F2F6F4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" font-weight="700">~3.34M</text>
    <text x="1050" y="354" fill="#83908B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">body tokens</text>

    <text x="924" y="429" fill="#687570" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.4">PRIORITY QUEUE</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
      <rect x="916" y="449" width="288" height="42" rx="7" fill="#11181D"/>
      <text x="936" y="475" fill="#F4B860">01</text>
      <text x="974" y="475" fill="#D7DEDB">deduplicate names</text>

      <rect x="916" y="499" width="288" height="42" rx="7" fill="#11181D"/>
      <text x="936" y="525" fill="#F4B860">02</text>
      <text x="974" y="525" fill="#D7DEDB">trim large bodies</text>

      <rect x="916" y="549" width="288" height="42" rx="7" fill="#11181D"/>
      <text x="936" y="575" fill="#F4B860">03</text>
      <text x="974" y="575" fill="#D7DEDB">complete metadata</text>
    </g>
    <text x="924" y="622" fill="#66E3C4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">TERMINAL / JSON / MARKDOWN</text>
  </g>

  <g fill="none" stroke="#66E3C4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M397 392h22l-7-7m7 7-7 7"/>
    <path d="M861 392h22l-7-7m7 7-7 7"/>
  </g>
</svg>
