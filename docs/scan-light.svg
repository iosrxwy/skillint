<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">skillint physical inventory scan</title>
  <desc id="desc">A light command output showing a read-only physical inventory of 1,658 skills with clearly labeled token estimates.</desc>
  <rect width="960" height="540" rx="28" fill="#F1F4FC"/>
  <rect x="24" y="24" width="912" height="492" rx="20" fill="#FFFFFF" stroke="#D8E1F0" stroke-width="2"/>
  <path d="M24 82h912" stroke="#E4EAF3"/>
  <circle cx="54" cy="54" r="6" fill="#F37D68"/>
  <circle cx="76" cy="54" r="6" fill="#F3B74F"/>
  <circle cx="98" cy="54" r="6" fill="#47C7A3"/>
  <text x="124" y="59" fill="#8294A6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">~/agent-skills / physical inventory</text>
  <rect x="818" y="40" width="88" height="28" rx="14" fill="#E8F8F3"/>
  <circle cx="836" cy="54" r="4" fill="#47C7A3"/>
  <text x="849" y="58" fill="#216A58" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">READ ONLY</text>

  <text x="52" y="124" fill="#3B66F0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700">$</text>
  <text x="75" y="124" fill="#16324A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">npx skillint scan -g</text>
  <text x="52" y="166" fill="#16324A" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="760">1,658 skills / 3 rules / 1,661 physical files</text>
  <text x="52" y="194" fill="#8294A6" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">Inventory estimates describe files on disk, not one agent's effective prompt.</text>

  <g transform="translate(52 224)">
    <rect width="408" height="190" rx="18" fill="#FCFCFD" stroke="#DCE4F0"/>
    <text x="24" y="34" fill="#8294A6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1.4">SIZE ESTIMATES</text>
    <path d="M24 50h360" stroke="#E4EAF3"/>
    <text x="24" y="83" fill="#667D91" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">name + description</text>
    <text x="384" y="83" text-anchor="end" fill="#16324A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700">~78,147 tokens</text>
    <text x="24" y="120" fill="#667D91" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">all bodies on disk</text>
    <text x="384" y="120" text-anchor="end" fill="#3B66F0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700">~3,427,608 tokens</text>
    <rect x="24" y="146" width="360" height="14" rx="7" fill="#EDF1FE"/>
    <rect x="24" y="146" width="8" height="14" rx="7" fill="#3B66F0"/>
    <text x="24" y="180" fill="#8294A6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">metadata is ~2.3% of estimated body size</text>
  </g>

  <g transform="translate(480 224)">
    <rect width="428" height="190" rx="18" fill="#FCFCFD" stroke="#DCE4F0"/>
    <text x="24" y="34" fill="#8294A6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1.4">NEXT ACTION</text>
    <path d="M24 50h380" stroke="#E4EAF3"/>
    <rect x="24" y="70" width="380" height="78" rx="14" fill="#EDF1FE"/>
    <text x="44" y="99" fill="#3156BF" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="750">Map one agent's actual catalog</text>
    <text x="44" y="124" fill="#16324A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">skillint map --agent cursor</text>
    <circle cx="34" cy="174" r="5" fill="#47C7A3"/>
    <text x="48" y="179" fill="#216A58" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">No skills executed / no scanned files changed</text>
  </g>

  <g transform="translate(52 442)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect width="130" height="34" rx="17" fill="#FDEBE7"/>
    <circle cx="18" cy="17" r="4" fill="#F37D68"/>
    <text x="31" y="22" fill="#A84635" font-size="11" font-weight="700">HEALTH 10/100</text>
    <text x="204" y="22" fill="#8294A6" font-size="11">scanned in 3.4s</text>
    <text x="856" y="22" text-anchor="end" fill="#8294A6" font-size="11">skillint 0.9.0</text>
  </g>
</svg>
